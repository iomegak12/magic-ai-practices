# ──────────────────────────────────────────────────────────
# Unified Docker Compose — use-cases-day4
# Orchestrates: Jaeger · MCP Server · REST API · Frontend
# Usage:
#   cp .env.example .env   # fill in Azure OpenAI credentials
#   docker compose up -d --build
#   Open http://localhost:3000 (chat UI)
#   Open http://localhost:16686 (Jaeger traces)
# ──────────────────────────────────────────────────────────

services:

  # ── Jaeger (distributed tracing) ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    networks:
      - app-network
    restart: unless-stopped

  # ── MCP Server (Orders & Complaints) ─────────────────
  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: orders-complaints-mcp
    ports:
      - "8700:8700"
    environment:
      - SERVER_NAME=orders-complaints-mcp-server
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8700
      - SEED_ON_STARTUP=true
    volumes:
      - mcp-db-data:/app/db
    networks:
      - app-network
    restart: unless-stopped

  # ── E2E REST API (FastAPI Agent Backend) ──────────────
  e2e-rest-api:
    build:
      context: ./e2e-rest-api
      dockerfile: Dockerfile
    container_name: e2e-rest-api
    ports:
      - "8800:8800"
    env_file:
      - .env
    environment:
      # ── Override service URLs to use Docker network names ──
      - MCP_ORDERS_URL=http://mcp-server:8700/mcp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ENABLE_OBSERVABILITY=true
      - ENABLE_CORS=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8800
    volumes:
      - app-data:/app/data
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - mcp-server
      - jaeger

  # ── Frontend (React + Nginx reverse proxy) ────────────
  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""          # empty → relative URLs → nginx proxies to API
    container_name: e2e-front-end
    ports:
      - "3000:80"
    volumes:
      - ./front-end/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - e2e-rest-api

# ── Shared resources ────────────────────────────────────
volumes:
  mcp-db-data:
    driver: local
  app-data:
    driver: local

networks:
  app-network:
    driver: bridge
