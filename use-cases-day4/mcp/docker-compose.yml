services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: iomega/magic-training-mcp
    container_name: orders-complaints-mcp
    ports:
      - "${SERVER_PORT:-8700}:8700"
    env_file:
      - .env
    volumes:
      - mcp-db-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/mcp')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mcp-db-data:
    driver: local
