services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: iomega/magic-training-mcp
    container_name: orders-complaints-mcp
    ports:
      - "${SERVER_PORT:-8700}:8700"
    env_file:
      - .env
    volumes:
      - mcp-db-data:/app/db
    restart: unless-stopped

volumes:
  mcp-db-data:
    driver: local
